; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = upesy_wroom

[env:upesy_wroom]
build_src_filter = +<*> -<diagnostics/>
platform = espressif32
board = upesy_wroom
framework = arduino

lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor

monitor_speed = 115200

[env:encoders]
platform = espressif32
board = upesy_wroom
framework = arduino
build_src_filter = +<diagnostics/encoders.cpp> +<hal/board.cpp>
monitor_speed = 115200

[env:motores_trapecio]
platform = espressif32
board = upesy_wroom
framework = arduino
build_src_filter = +<diagnostics/motores_trapecio.cpp> +<hal/board.cpp>
monitor_speed = 115200

; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = upesy_wroom

[env:upesy_wroom]
build_src_filter = +<*> -<diagnostics/>
platform = espressif32
board = upesy_wroom
framework = arduino

lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor

monitor_speed = 115200

[env:encoders]
platform = espressif32
board = upesy_wroom
framework = arduino
build_src_filter = +<diagnostics/encoders.cpp> +<devices/encoders.cpp> +<hal/board.cpp>
monitor_speed = 115200

[env:motores_trapecio]
platform = espressif32
board = upesy_wroom
framework = arduino
build_src_filter = +<diagnostics/motores_trapecio.cpp> +<devices/motores.cpp> +<hal/board.cpp>
monitor_speed = 115200

[env:motores_zona_muerta]
platform = espressif32
board = upesy_wroom
framework = arduino
build_src_filter = +<diagnostics/motores_zona_muerta.cpp> +<devices/motores.cpp> +<devices/encoders.cpp> +<hal/board.cpp>
monitor_speed = 115200

[env:movimiento_adelante_atras]
platform = espressif32
board = upesy_wroom
framework = arduino
build_src_filter = +<diagnostics/movimiento_adelante_atras.cpp> +<devices/motores.cpp> +<hal/board.cpp>
monitor_speed = 115200

[env:bno055]
platform = espressif32
board = upesy_wroom
framework = arduino
build_src_filter = +<diagnostics/bno055.cpp> +<devices/IMU.cpp> +<hal/board.cpp>
lib_deps = ${env:upesy_wroom.lib_deps}
monitor_speed = 115200

[env:inclinacion_bluetooth]
platform = espressif32
board = upesy_wroom
framework = arduino
build_src_filter = +<diagnostics/inclinacion_bluetooth.cpp> +<devices/IMU.cpp> +<hal/board.cpp>
lib_deps = ${env:upesy_wroom.lib_deps}
monitor_speed = 115200

[env:equilibrio_pd]
platform = espressif32
board = upesy_wroom
framework = arduino
build_src_filter = +<diagnostics/equilibrio_pd.cpp> +<devices/IMU.cpp> +<devices/motores.cpp> +<devices/encoders.cpp> +<hal/board.cpp>
lib_deps = ${env:upesy_wroom.lib_deps}
monitor_speed = 115200
